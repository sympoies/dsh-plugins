# Finish-line validation contract. agent-hook and the agent-runtime-kit
# finish-line hooks block a turn that edited files until these commands pass.
# [path_classes] is the project-owned path classification read by nils-cli
# phase-aware test-first and docs-impact checks.

[[validation]]
context = "project-dev"
product = ["codex", "claude", "hermes", "dsh"]
commands = ["npm run check"]
description = "Run the complete routine repository gate once for the stable candidate."

[path_classes]
production = [".gitignore", ".node-version", "VALIDATION.toml", "package.json", "package-lock.json", "tsconfig.json", ".agents/**", ".github/workflows/**", "scripts/check-reviewed-release-source.ts", "scripts/release-package.ts", "packages/*/package.json", "packages/*/release/**", "packages/*/build.client.mjs", "packages/*/cordis.patch.yml", "packages/*/tsconfig*.json", "packages/dsh-telegram/src/**", "packages/llm-codex-subscription/src/index.ts", "packages/llm-codex-subscription/src/payload.ts"]
test = ["vitest.config.ts", "scripts/*.test.ts", "packages/*/vitest.config.ts", "packages/*/test/**", "packages/llm-codex-subscription/src/*.test.ts"]
docs = ["AGENTS.md", "CONTRIBUTING.md", "README.md", "LICENSE", "SECURITY.md", "docs/**", "packages/README.md", "packages/*/README.md", "packages/*/LICENSE", "packages/*/NOTICE"]
unmatched = "unknown"
